services:
  campus-connect:
    build: .
    image: 3464abhigyan/campus-connect:1.0
    container_name: campus-connect
    ports:
      - "8081:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: campus-connect-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: campus-connect-grafana
    ports:
      - "3000:3000"
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: campus-connect-blackbox
    ports:
      - "9115:9115"